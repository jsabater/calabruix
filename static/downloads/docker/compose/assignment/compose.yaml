# compose.yaml

# Extensions YAML

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

x-restart-policy: &restart-policy
  restart: unless-stopped

# Serveis

services:

  # Traefik - Proxy invers
  traefik:
    image: traefik:v3.6
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entryPoints.web.address=:80"
      - "--ping=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    logging: *default-logging
    <<: *restart-policy

  # NGINX - Front-end estàtic
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=!PathPrefix(`/api`) && !PathPrefix(`/adminer`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=sportsclub-frontend"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
    logging: *default-logging
    <<: *restart-policy

  # API REST - Django Ninja (Sports Club)
  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.docker.network=sportsclub-frontend"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/core/health"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    <<: *restart-policy

  # PostgreSQL - Base de dades
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    <<: *restart-policy

  # Valkey - Cache
  valkey:
    image: valkey/valkey:9.1-alpine
    command: valkey-server --requirepass ${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    networks:
      - backend
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD} ping | grep -q PONG"]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    <<: *restart-policy

  # RabbitMQ - Broker de missatges
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    <<: *restart-policy

  # Worker - Consumidor de RabbitMQ
  worker:
    build:
      context: ./docker/worker
      dockerfile: Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}
      QUEUE_NAME: tasks
      API_HOST: api
      API_PORT: 8080
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: noreply@sportsclub.local
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles:
      - dev
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    <<: *restart-policy

  # Adminer - Gestió de base de dades (perfil dev)
  adminer:
    image: adminer:latest
    networks:
      - backend
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
      - "traefik.docker.network=sportsclub-frontend"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev
    logging: *default-logging
    <<: *restart-policy

  # Mailpit - Servidor SMTP de proves (perfil dev)
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025"
    networks:
      - backend
    profiles:
      - dev
    logging: *default-logging
    <<: *restart-policy

# Xarxes
networks:
  frontend:
    name: sportsclub-frontend
  backend:
    name: sportsclub-backend

# Volums
volumes:
  postgres-data:
    name: sportsclub-postgres-data
  valkey-data:
    name: sportsclub-valkey-data
  rabbitmq-data:
    name: sportsclub-rabbitmq-data
