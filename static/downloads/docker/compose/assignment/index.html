<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Club</title>
    <script src="https://unpkg.com/htmx.org@2.0.10"></script>
    <!--script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script-->
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
        }

        .status-bar {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--card-bg);
            border-radius: 0.5rem;
            border: 1px solid var(--border);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-indicator.healthy {
            background: var(--success);
        }

        .status-indicator.unhealthy {
            background: var(--error);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .card-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .card-body {
            padding: 1.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-sm {
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: var(--bg);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .error {
            color: var(--error);
            padding: 1rem;
            background: #fef2f2;
            border-radius: 0.5rem;
            text-align: center;
        }

        .empty {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            background: var(--bg);
            color: var(--text-muted);
        }

        .htmx-request .loading {
            display: block;
        }

        .htmx-request .content {
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sports Club</h1>
            <p>Gestió del club d'atletisme</p>
        </header>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-indicator" id="api-status"></span>
                <span>API</span>
            </div>
            <div class="status-item">
                <span class="status-indicator" id="db-status"></span>
                <span>Base de dades</span>
            </div>
        </div>

        <div class="grid">
            <!-- Atletes -->
            <div class="card">
                <div class="card-header">
                    <h2>Atletes</h2>
                    <button type="button" class="btn btn-primary btn-sm"
                            hx-get="/api/v1/people/athletes"
                            hx-target="#athletes-table"
                            hx-indicator="#athletes-loading">
                        Actualitzar
                    </button>
                </div>
                <div class="card-body">
                    <div id="athletes-loading" class="loading htmx-indicator">
                        Carregant atletes...
                    </div>
                    <div id="athletes-table"
                         hx-get="/api/v1/people/athletes"
                         hx-trigger="load"
                         hx-indicator="#athletes-loading">
                    </div>
                </div>
            </div>

            <!-- Entrenadors -->
            <div class="card">
                <div class="card-header">
                    <h2>Entrenadors</h2>
                    <button type="button" class="btn btn-primary btn-sm"
                            hx-get="/api/v1/people/coaches"
                            hx-target="#coaches-table"
                            hx-indicator="#coaches-loading">
                        Actualitzar
                    </button>
                </div>
                <div class="card-body">
                    <div id="coaches-loading" class="loading htmx-indicator">
                        Carregant entrenadors...
                    </div>
                    <div id="coaches-table"
                         hx-get="/api/v1/people/coaches"
                         hx-trigger="load"
                         hx-indicator="#coaches-loading">
                    </div>
                </div>
            </div>

            <!-- Instal·lacions -->
            <div class="card">
                <div class="card-header">
                    <h2>Instal·lacions</h2>
                    <button type="button" class="btn btn-primary btn-sm"
                            hx-get="/api/v1/inventory/venues"
                            hx-target="#venues-table"
                            hx-indicator="#venues-loading">
                        Actualitzar
                    </button>
                </div>
                <div class="card-body">
                    <div id="venues-loading" class="loading htmx-indicator">
                        Carregant instal·lacions...
                    </div>
                    <div id="venues-table"
                         hx-get="/api/v1/inventory/venues"
                         hx-trigger="load"
                         hx-indicator="#venues-loading">
                    </div>
                </div>
            </div>

            <!-- Activitats -->
            <div class="card">
                <div class="card-header">
                    <h2>Entrenaments</h2>
                    <button type="button" class="btn btn-primary btn-sm"
                            hx-get="/api/v1/scheduling/trainings"
                            hx-target="#trainings-table"
                            hx-indicator="#trainings-loading">
                        Actualitzar
                    </button>
                </div>
                <div class="card-body">
                    <div id="trainings-loading" class="loading htmx-indicator">
                        Carregant entrenaments...
                    </div>
                    <div id="trainings-table"
                         hx-get="/api/v1/scheduling/trainings"
                         hx-trigger="load"
                         hx-indicator="#trainings-loading">
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Sports Club &copy; 2026 — Pràctica de Docker Compose</p>
        </footer>
    </div>

    <script>
        // Verificar l'estat de l'API
        async function checkHealth() {
            const apiStatus = document.getElementById('api-status');
            const dbStatus = document.getElementById('db-status');

            try {
                const response = await fetch('/api/v1/health');
                const data = await response.json();

                if (response.ok && data.status === 'healthy') {
                    apiStatus.classList.add('healthy');
                    apiStatus.classList.remove('unhealthy');
                    
                    if (data.database === 'connected') {
                        dbStatus.classList.add('healthy');
                        dbStatus.classList.remove('unhealthy');
                    } else {
                        dbStatus.classList.add('unhealthy');
                        dbStatus.classList.remove('healthy');
                    }
                } else {
                    apiStatus.classList.add('unhealthy');
                    apiStatus.classList.remove('healthy');
                    dbStatus.classList.add('unhealthy');
                    dbStatus.classList.remove('healthy');
                }
            } catch (error) {
                apiStatus.classList.add('unhealthy');
                apiStatus.classList.remove('healthy');
                dbStatus.classList.add('unhealthy');
                dbStatus.classList.remove('healthy');
            }
        }

        // Transformar respostes JSON en taules HTML
        document.body.addEventListener('htmx:beforeSwap', function(event) {
            if (event.detail.xhr.getResponseHeader('Content-Type')?.includes('application/json')) {
                try {
                    const data = JSON.parse(event.detail.serverResponse);
                    event.detail.serverResponse = renderTable(data, event.detail.target.id);
                } catch (e) {
                    event.detail.serverResponse = '<div class="error">Error processant les dades</div>';
                }
            }
        });

        function renderTable(data, targetId) {
            if (!Array.isArray(data) || data.length === 0) {
                return '<div class="empty">No hi ha dades disponibles</div>';
            }

            // Determinar les columnes segons el tipus de dades
            let columns = [];
            let headers = [];

            if (targetId === 'athletes-table') {
                columns = ['first_name', 'last_name', 'email'];
                headers = ['Nom', 'Cognoms', 'Email'];
            } else if (targetId === 'coaches-table') {
                columns = ['first_name', 'last_name', 'email'];
                headers = ['Nom', 'Cognoms', 'Email'];
            } else if (targetId === 'venues-table') {
                columns = ['name', 'venue_type', 'capacity'];
                headers = ['Nom', 'Tipus', 'Capacitat'];
            } else if (targetId === 'trainings-table') {
                columns = ['name', 'date', 'focus'];
                headers = ['Nom', 'Data', 'Focus'];
            } else {
                // Columnes genèriques
                columns = Object.keys(data[0]).slice(0, 4);
                headers = columns;
            }

            let html = '<table><thead><tr>';
            headers.forEach(h => html += `<th>${h}</th>`);
            html += '</tr></thead><tbody>';

            data.forEach(item => {
                html += '<tr>';
                columns.forEach(col => {
                    let value = item[col] ?? '-';
                    if (col === 'date' && value !== '-') {
                        value = new Date(value).toLocaleDateString('ca-ES');
                    }
                    if (col === 'venue_type') {
                        value = `<span class="badge">${value}</span>`;
                    }
                    html += `<td>${value}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        // Gestionar errors d'HTMX
        document.body.addEventListener('htmx:responseError', function(event) {
            event.detail.target.innerHTML = '<div class="error">Error carregant les dades. Verifica que l\'API està en funcionament.</div>';
        });

        // Comprovar l'estat periòdicament
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
